version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_compras
    environment:
      POSTGRES_DB: compras_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - compras_data:/var/lib/postgresql/data
    networks:
      - microservicios_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  productos-service:
    build:
      context: ./product
      dockerfile: Dockerfile
    container_name: productos-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/compras_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - microservicios_net

  inventario-service:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: inventario-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/compras_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - microservicios_net

volumes:
  compras_data:

networks:
  microservicios_net:
